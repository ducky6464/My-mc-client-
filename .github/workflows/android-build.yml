name: Godot Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skybound-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Validate project and export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify Android build environment
        run: |
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -x /usr/lib/android-sdk/platform-tools/adb
          test -f /root/debug.keystore
          test -f /root/.config/godot/editor_settings-4.5.tres
          echo "Java, Android SDK, debug keystore, and Godot editor settings are present."

      - name: Import and validate project
        run: |
          export HOME=/root
          godot --headless --editor --path . --quit

      - name: Launch main scene smoke test
        run: |
          export HOME=/root
          godot --headless --path . --quit-after 3

      - name: Export Android debug APK
        run: |
          export HOME=/root
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-debug "Android" build/android/SkyboundSurvival-debug.apk
          test -s build/android/SkyboundSurvival-debug.apk

      - name: Re-sign APK for broad Android installer compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find /usr/lib/android-sdk/build-tools -type d -name '[0-9]*' | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -f 4 build/android/SkyboundSurvival-debug.apk build/android/SkyboundSurvival-aligned.apk
          "$APKSIGNER" sign \
            --ks /root/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out build/android/SkyboundSurvival-signed.apk \
            build/android/SkyboundSurvival-aligned.apk
          mv build/android/SkyboundSurvival-signed.apk build/android/SkyboundSurvival-debug.apk
          "$APKSIGNER" verify --verbose --print-certs build/android/SkyboundSurvival-debug.apk
          "$ZIPALIGN" -c -v 4 build/android/SkyboundSurvival-debug.apk
          rm build/android/SkyboundSurvival-aligned.apk

      - name: Verify APK package metadata
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find /usr/lib/android-sdk/build-tools -type d -name '[0-9]*' | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging build/android/SkyboundSurvival-debug.apk | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          test "$(stat -c %s build/android/SkyboundSurvival-debug.apk)" -gt 1000000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skybound-Survival-Android-debug
          path: build/android/SkyboundSurvival-debug.apk
          if-no-files-found: error
          retention-days: 14
