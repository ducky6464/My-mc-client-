name: Godot Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Validate project and export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify Android build environment
        run: |
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -x /usr/lib/android-sdk/platform-tools/adb
          test -f /root/debug.keystore
          test -f /root/.config/godot/editor_settings-4.5.tres
          echo "Java, Android SDK, debug keystore, and Godot editor settings are present."

      - name: Import and validate project
        run: |
          export HOME=/root
          godot --headless --editor --path . --quit

      - name: Launch main scene smoke test
        run: |
          export HOME=/root
          godot --headless --path . --quit-after 3

      - name: Export Android debug APK
        run: |
          export HOME=/root
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/SkyboundSurvival-debug.apk
          test -s build/android/SkyboundSurvival-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skybound-Survival-Android-debug
          path: build/android/SkyboundSurvival-debug.apk
          if-no-files-found: error
          retention-days: 14
